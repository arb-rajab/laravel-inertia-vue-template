<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widget embed example</title>
</head>
<body>
  <h1>A third-party page embedding the widget</h1>
  <div id="widget"></div>

  <!-- Build first: npm run build:widget (writes public/widget.js). -->
  <script src="/widget.js"></script>
  <script>
    window.StarterAppWidget.mount('#widget', { label: 'Embedded widget' })
  </script>
</body>
</html>
